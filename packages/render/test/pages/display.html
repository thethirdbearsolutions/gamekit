<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { HdrPipeline, displayToSceneGlsl, displayUniforms } from '@gamekit/render';
try {
  const renderer = new THREE.WebGLRenderer();
  renderer.setPixelRatio(1);
  renderer.setSize(64, 64, false);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
  camera.position.z = 5;
  const colours = [[0.5, 0.25, 0.1], [0.12, 0.45, 0.62], [0.9, 0.95, 0.97], [0.75, 0.2, 0.85]];
  const exposure = 1.05;
  // Before: raw shaders straight to the canvas (display-referred, as in waterfall-falls today).
  // After: the same shader wrapped in gkDisplayToScene, through the ACES pipeline.
  const quads = colours.map((c, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
      uniforms: { ...displayUniforms(exposure), c: { value: new THREE.Vector3(...c) }, wrap: { value: 0 } },
      vertexShader: 'void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }',
      fragmentShader: displayToSceneGlsl() + 'uniform vec3 c; uniform float wrap; void main() { gl_FragColor = vec4( wrap > 0.5 ? gkDisplayToScene( c ) : c, 1.0 ); }',
    }));
    m.position.set(i % 2 ? 0.5 : -0.5, i < 2 ? 0.5 : -0.5, 0);
    scene.add(m);
    return m;
  });
  const at = [[16, 48], [48, 48], [16, 16], [48, 16]];
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = exposure;
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  const px = (x, y) => { const p = new Uint8Array(4); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; };
  const before = at.map(([x, y]) => px(x, y));
  for (const q of quads) q.material.uniforms.wrap.value = 1;
  const hdr = new HdrPipeline(renderer, scene, camera, { toneMapping: 'aces', exposure, samples: 0, dither: false, bloom: { mode: 'off' } });
  const rt = new THREE.WebGLRenderTarget(64, 64);
  hdr.render(rt);
  const after = at.map(([x, y]) => { const p = new Uint8Array(4); renderer.readRenderTargetPixels(rt, x, y, 1, 1, p); return [...p.slice(0, 3)]; });
  // And what the FALLS-14 attempt did: the raw shader through the pipeline, unwrapped.
  for (const q of quads) q.material.uniforms.wrap.value = 0;
  hdr.render(rt);
  const naive = at.map(([x, y]) => { const p = new Uint8Array(4); renderer.readRenderTargetPixels(rt, x, y, 1, 1, p); return [...p.slice(0, 3)]; });
  window.__result = { before, after, naive };
} catch (e) { window.__error = String(e.stack || e); }
</script>
