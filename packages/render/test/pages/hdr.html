<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { HdrPipeline, auditShaders } from '@gamekit/render';
try {
  const renderer = new THREE.WebGLRenderer();
  renderer.setPixelRatio(1);
  renderer.setSize(256, 256, false);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
  camera.position.z = 5;
  const mid = new THREE.Color().setRGB(0.5, 0.25, 0.1, THREE.LinearSRGBColorSpace);
  const quad = (x, y, mat, s = 0.3) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), mat); m.position.set(x, y, 0); scene.add(m); return m; };
  // A custom shader writing scene-linear colour, no includes (the recommended form).
  const custom = new THREE.ShaderMaterial({
    uniforms: { c: { value: new THREE.Vector3(0.5, 0.25, 0.1) } },
    vertexShader: 'void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }',
    fragmentShader: 'uniform vec3 c; void main() { gl_FragColor = vec4( c, 1.0 ); }',
  });
  const hot = (v) => new THREE.ShaderMaterial({
    vertexShader: 'void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }',
    fragmentShader: `void main() { gl_FragColor = vec4( vec3( ${v.toFixed(1)} ), 1.0 ); }`,
  });
  quad(-0.5, 0.5, custom);
  quad(0.5, 0.5, new THREE.MeshBasicMaterial({ color: mid }));
  const selected = quad(-0.5, -0.5, hot(8), 0.1);
  quad(0.5, -0.5, hot(8), 0.1);

  const read = (x, y, rt) => { const p = new Uint8Array(4); renderer.readRenderTargetPixels(rt, x, y, 1, 1, p); return [...p.slice(0, 3)]; };
  const rt = new THREE.WebGLRenderTarget(256, 256);
  // Reference: three rendering straight to an sRGB target with its own AgX.
  const ref = new THREE.WebGLRenderTarget(256, 256, { colorSpace: THREE.SRGBColorSpace });
  renderer.toneMapping = THREE.AgXToneMapping;
  renderer.setRenderTarget(ref);
  // Tone mapping only applies for the canvas or XR targets, so draw to the canvas and copy.
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  const canvasPx = (x, y) => { const p = new Uint8Array(4); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; };
  const refBasic = canvasPx(192, 192);

  const hdr = new HdrPipeline(renderer, scene, camera, { toneMapping: 'agx', samples: 0, dither: false, bloom: { mode: 'off' } });
  hdr.selectBloom(selected);
  hdr.render(rt);
  const off = { custom: read(64, 192, rt), basic: read(192, 192, rt), nearSel: read(64, 96, rt), nearUnsel: read(192, 96, rt) };
  hdr.bloomMode = 'selective'; hdr.bloomStrength = 1;
  hdr.render(rt);
  const sel = { custom: read(64, 192, rt), nearSel: read(64, 96, rt), nearUnsel: read(192, 96, rt) };
  hdr.bloomMode = 'threshold';
  hdr.render(rt);
  const thr = { nearSel: read(64, 96, rt), nearUnsel: read(192, 96, rt) };
  hdr.bloomMode = 'both';
  hdr.render(rt);
  const both = { nearSel: read(64, 96, rt), nearUnsel: read(192, 96, rt) };
  hdr.render(); // to the canvas, must not throw

  const bad = new THREE.Mesh(new THREE.PlaneGeometry(), new THREE.ShaderMaterial({ fragmentShader: 'void main() { vec3 c = vec3(2.0); c = c / ( c + vec3( 1.0 ) ); gl_FragColor = vec4( pow( c, vec3( 1.0 / 2.2 ) ), 1.0 ); }' }));

  window.__result = { refBasic, off, sel, thr, both, audit: auditShaders(bad).map((f) => f.issue), auditClean: auditShaders(scene).length };
} catch (e) { window.__error = String(e.stack || e); }
</script>
