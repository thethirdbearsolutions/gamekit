<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { HdrPipeline, installDisplayFog } from '@gamekit/render';
try {
  const exposure = 1.05;
  const fogOn = new URLSearchParams(location.search).get('patch') === '1';
  if (fogOn) installDisplayFog();
  const renderer = new THREE.WebGLRenderer();
  renderer.setPixelRatio(1);
  renderer.setSize(64, 64, false);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(new THREE.Color(0.85, 0.88, 0.9), 0.02);
  scene.add(new THREE.AmbientLight(0xffffff, 2));
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
  // Four quads at increasing distance, so fog goes from none to heavy.
  [5, 25, 60, 120].forEach((d, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0x334422 }));
    const s = d * Math.tan(Math.PI / 6) * 0.9;
    m.scale.setScalar(s);
    m.position.set((i % 2 ? 0.5 : -0.5) * s, (i < 2 ? 0.5 : -0.5) * s, -d);
    scene.add(m);
  });
  const at = [[16, 48], [48, 48], [16, 16], [48, 16]];
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = exposure;
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  const direct = at.map(([x, y]) => { const p = new Uint8Array(4); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; });
  const hdr = new HdrPipeline(renderer, scene, camera, { toneMapping: 'aces', exposure, samples: 0, dither: false, bloom: { mode: 'off' } });
  const rt = new THREE.WebGLRenderTarget(64, 64);
  hdr.render(rt);
  const piped = at.map(([x, y]) => { const p = new Uint8Array(4); renderer.readRenderTargetPixels(rt, x, y, 1, 1, p); return [...p.slice(0, 3)]; });
  window.__result = { direct, piped };
} catch (e) { window.__error = String(e.stack || e); }
</script>
