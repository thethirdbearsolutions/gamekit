<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { HdrPipeline, OVERLAY_GLSL, installDisplayFog, overlayUniforms } from '@gamekit/render';
try {
  installDisplayFog();
  const exposure = 1.05;
  const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(128, 128, false);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xdde4ea, 0.01);
  scene.add(new THREE.AmbientLight(0xffffff, 2));
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  camera.position.z = 5;
  // Opaque backdrop (built-in, fogged) and a translucent "waterfall" whose raw
  // shader paints display-tuned rainbow bands, as waterfall-falls does.
  const back = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0x5a3020 }));
  back.position.z = -2;
  const sheet = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { ...overlayUniforms() },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }',
    fragmentShader: OVERLAY_GLSL + `varying vec2 vUv;
      vec3 hueRainbow( float t ) { return clamp( abs( mod( t * 6.0 + vec3( 0.0, 4.0, 2.0 ), 6.0 ) - 3.0 ) - 1.0, 0.0, 1.0 ); }
      void main() { vec3 c = hueRainbow( vUv.x ); gl_FragColor = gkOverlayOut( c, 0.65, c * 3.0 ); }`,
  }));
  const dot = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
  dot.position.set(-1.5, 1.5, 1);
  scene.add(back, sheet, dot);
  const gl = renderer.getContext();
  const xs = [20, 40, 64, 88, 108];
  const read = () => xs.map((x) => { const p = new Uint8Array(4); gl.readPixels(x, 64, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; })
    .concat([(() => { const p = new Uint8Array(4); gl.readPixels(34, 94, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; })()]);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = exposure;
  renderer.render(scene, camera);
  const direct = read();
  const hdr = new HdrPipeline(renderer, scene, camera, { toneMapping: 'aces', exposure, samples: 0, dither: false, bloom: { mode: 'off' }, display: { transparent: true } });
  hdr.render();
  const piped = read();
  // Glow: the sheet feeds bloom through gkOverlayOut; just outside it gets brighter.
  const edge = () => { const p = new Uint8Array(4); gl.readPixels(64, 18, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return [...p.slice(0, 3)]; };
  const noGlow = edge();
  hdr.selectBloom(sheet);
  hdr.bloomMode = 'threshold'; hdr.bloomStrength = 1;
  hdr.render();
  const glow = edge();
  window.__result = { direct, piped, noGlow, glow, items: hdr.overlay.items.length };
} catch (e) { window.__error = String(e.stack || e); }
</script>
